async function startDownload() {
  const btn = document.getElementById("startBtn");
  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  btn.disabled = true;
  let done = 0, failed = 0;

  for (const img of images) {
    try {
      const res = await fetch(img.url, { mode: "cors" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = img.name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      done++;
      status.textContent += "✅ " + img.name + "\n";
    } catch (e) {
      failed++;
      status.textContent += "❌ " + img.name + " (échec : " + e.message + ")\n";
    }
    progress.textContent = "Progression : " + (done + failed) + " / 174 (✅ " + done + " / ❌ " + failed + ")";
    await new Promise(r => setTimeout(r, 150));
  }
  progress.textContent += "  — Terminé !";
  btn.disabled = false;
  btn.textContent = "Relancer";
}
